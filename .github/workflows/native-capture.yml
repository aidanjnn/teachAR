name: Native capture domain
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-capture-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Exercise actual C# calibration, bounded capture and replay
        run: dotnet run --project tests/native-capture/NativeCapture.csproj --configuration Release
      # Supplemental domain harness. Check also requires native-unity.yml; device acceptance is separate.
