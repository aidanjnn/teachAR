# Called by Check on every PR/push/merge group; missing licensing fails closed.
name: Native Unity gates
on:
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false
      UNITY_SERIAL:
        required: false
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  prerequisites:
    name: Unity licensing prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require configured Unity activation
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]] || [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo '::error::Native gates require UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE or UNITY_SERIAL repository secrets. See docs/ci.md. No Unity check ran.'
            exit 1
          fi

  tests:
    name: Unity ${{ matrix.mode }}
    needs: prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [editmode, playmode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the pinned editor
        id: editor
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' apps/quest/ProjectSettings/ProjectVersion.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+f[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run actual Unity tests with Android support
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          # Coverage stays off to keep the package set unchanged. The runner input `coverageEnabled: false`
          # emits `--no-coverageEnabled`, which game-ci/cli v0.1.69 rejects as an unknown argument
          # (its parser disables negation prefixes) and exits before Unity starts. The CLI also reads every
          # option from GAME_CI_<OPTION>, so the same setting is passed through the environment instead.
          GAME_CI_COVERAGE_ENABLED: 'false'
        with:
          cliVersion: v0.1.69
          projectPath: apps/quest
          customImage: unityci/editor:ubuntu-${{ steps.editor.outputs.version }}-android-3
          testMode: ${{ matrix.mode }}
          customParameters: -buildTarget Android
          artifactsPath: artifacts/quest-ci/${{ matrix.mode }}
          githubToken: ''
      - name: Require nonempty passing XML
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: python3 scripts/verify-native-ci.py tests "artifacts/quest-ci/$TEST_MODE"
      - name: Preserve test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-${{ matrix.mode }}-${{ github.sha }}
          path: artifacts/quest-ci/${{ matrix.mode }}/**/*.xml
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android ARM64 IL2CPP
    needs: [prerequisites, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build with the production configuration and guard
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: apps/quest
          targetPlatform: Android
          buildMethod: Trail.Editor.ProjectSetup.BuildAndroidCi
          versioning: None
      - name: Verify build report and actual ARM64 IL2CPP binary
        run: python3 scripts/verify-native-ci.py build artifacts/quest-ci/android
      - name: Preserve verified APK and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quest-android-${{ github.sha }}
          path: |
            artifacts/quest-ci/android/Trail.apk
            artifacts/quest-ci/android/build.json
          if-no-files-found: error
          retention-days: 7
