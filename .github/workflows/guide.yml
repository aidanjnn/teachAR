name: Native guide software
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guide:
    name: Pure C# guide and contract integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Run actual guide scenarios and golden integration
        run: dotnet run --project tests/guide-harness/GuideHarness.csproj --configuration Release
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
