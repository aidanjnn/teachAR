name: Native guide software
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guide:
    name: Pure C# guide and contract integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Run actual guide scenarios and golden integration
        run: dotnet run --project tests/guide-harness/GuideHarness.csproj --configuration Release
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

  unity-runner:
    name: Require licensed Unity CI runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.runner.outputs.labels }}
    steps:
      - name: Validate native runner configuration
        id: runner
        env:
          RUNNER_LABELS: ${{ vars.TRAIL_UNITY_RUNNER_LABELS }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os
          try:
              labels = json.loads(os.environ['RUNNER_LABELS'])
              assert isinstance(labels, list) and labels
              assert all(isinstance(label, str) and label.strip() for label in labels)
              assert 'self-hosted' in labels
          except (ValueError, AssertionError):
              raise SystemExit('::error::Configure TRAIL_UNITY_RUNNER_LABELS as a JSON array of labels for a licensed Unity runner with Android Build Support. See docs/ci.md. No native gate ran.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('labels=' + json.dumps(labels) + '\n')
          PYTHON

  unity:
    name: Unity ${{ matrix.gate }}
    needs: unity-runner
    runs-on: ${{ fromJSON(needs.unity-runner.outputs.labels) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Avoid competing editor/license processes on a single provisioned runner.
      max-parallel: 1
      matrix:
        include:
          - gate: EditMode
            command: quest:test
          - gate: PlayMode
            command: quest:test:play
          - gate: Android ARM64 IL2CPP
            command: quest:build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run native gate and verify fresh evidence
        env:
          UNITY_EDITOR: ${{ vars.TRAIL_UNITY_EDITOR }}
          NATIVE_COMMAND: ${{ matrix.command }}
        shell: bash
        run: pnpm "$NATIVE_COMMAND"
      - name: Upload native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quest-${{ matrix.gate }}-${{ github.run_attempt }}
          path: artifacts/quest/
          if-no-files-found: ignore
          retention-days: 7
